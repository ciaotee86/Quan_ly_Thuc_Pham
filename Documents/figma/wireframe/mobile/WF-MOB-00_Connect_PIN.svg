<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#F8FAFC;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  
    <pattern id="wfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#wfGrid)" opacity="0.6" />
  <!-- Wireframe Frame: MOB-00: Connect LAN Server [BLUEPRINT] -->

  <rect x="0" y="0" width="390" height="844" rx="44" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
  <rect x="135" y="10" width="120" height="30" rx="15" fill="#000" />
  
  <g transform="translate(20, 120)">
    <rect x="130" y="0" width="90" height="90" rx="24" fill="#F1F5F9" filter="url(#shadow)" />
    <text x="155" y="58" fill="#0F172A" font-size="42">🥬</text>

    <text x="175" y="125" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="700">[WIREFRAME] FoodManagement Client</text>
    <text x="175" y="150" text-anchor="middle" fill="#64748B" font-size="13">Kết nối Desktop Server qua mạng LAN (:8080)</text>

    <g transform="translate(0, 190)">
      <text x="10" y="18" fill="#64748B" font-size="12">ĐỊA CHỈ IP / CỔNG DESKTOP SERVER</text>
      <rect x="0" y="28" width="350" height="46" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <text x="16" y="57" fill="#0284C7" font-size="15" font-weight="600">http://192.168.1.100:8080</text>

      <text x="10" y="105" fill="#64748B" font-size="12">GIAO THỨC &amp; KÊNH REALTIME</text>
      <rect x="0" y="115" width="350" height="46" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <text x="16" y="143" fill="#1E293B" font-size="13" font-weight="700">HTTP/1.1 + REST JSON + SSE (/api/events)</text>

      <g cursor="pointer" transform="translate(0, 190)">
        <rect x="0" y="0" width="350" height="50" rx="10" fill="#1E293B" filter="url(#shadow)" />
        <text x="175" y="31" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">KIỂM TRA KẾT NỐI (/api/status)</text>
      </g>

      <g cursor="pointer" transform="translate(0, 255)">
        <rect x="0" y="0" width="350" height="50" rx="10" fill="#0F172A" stroke="#64748B" stroke-width="1" stroke-dasharray="4 3" />
        <text x="175" y="31" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">📷 QUÉT QR LAN [Future Scope]</text>
      </g>
    </g>
  </g>
  </svg>