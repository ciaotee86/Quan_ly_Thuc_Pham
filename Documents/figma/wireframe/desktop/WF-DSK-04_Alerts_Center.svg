      <text x="36" y="48" fill="#64748B" font-size="11">HTTP/1.1 + REST JSON + SSE</text>
      <text x="36" y="66" fill="#0284C7" font-size="11">TCP :8080 • /api/events</text>
    </g>

    <!-- Content Area Background -->
    <rect x="260" y="96" width="1180" height="804" fill="#F1F5F9" />
  
  <g id="Content_DSK-04" transform="translate(284, 116)">
    <text x="0" y="24" fill="#0F172A" font-size="22" font-weight="700">Trung Tâm Cảnh Báo Thông Minh &amp; Đề Xuất Mua Sắm</text>
    <text x="0" y="48" fill="#64748B" font-size="13">Quản lý các rủi ro lãng phí thực phẩm và định mức tồn kho tối thiểu</text>

    <!-- Tabs -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="220" height="40" rx="8" fill="#1E293B" />
      <text x="32" y="25" fill="#0F172A" font-size="14" font-weight="700">Cảnh Báo Hết Hạn (3)</text>

      <rect x="230" y="0" width="220" height="40" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <text x="255" y="25" fill="#64748B" font-size="14">Cảnh Báo Sắp Hết (2)</text>

      <rect x="460" y="0" width="220" height="40" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <text x="480" y="25" fill="#64748B" font-size="14">Danh Sách Mua Sắm</text>
    </g>

    <!-- Alerts Feed (Chuẩn 4 màu vòng đời) -->
    <g transform="translate(0, 130)">
      <!-- 1. Đỏ rực: Quá hạn / Hết hạn hôm nay + cảnh báo tiêu hủy -->
      <rect x="0" y="0" width="1130" height="90" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
      <circle cx="40" cy="45" r="18" fill="#FEE2E2" />
      <text x="35" y="52" fill="#DC2626" font-size="18" font-weight="700">!</text>
      <text x="80" y="36" fill="#DC2626" font-size="16" font-weight="700">Sữa chua không đường (LOT-000) đã hết hạn hôm nay — Cần tiêu hủy</text>
      <text x="80" y="60" fill="#64748B" font-size="13">Vị trí: Tủ lạnh &gt; Ngăn mát • Hạn dùng: 15/11/2026 • Không dùng chế biến</text>
      <rect x="960" y="28" width="140" height="34" rx="6" fill="#B91C1C" />
      <text x="985" y="50" fill="#0F172A" font-size="13" font-weight="600">Vứt hủy ngay</text>

      <!-- 2. Vàng cam + ⏳: Cận hạn FEFO Cấp 1 (1-3 ngày) -->
      <rect x="0" y="110" width="1130" height="90" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.5" />
      <circle cx="40" cy="155" r="18" fill="#1E293B" />
      <text x="31" y="162" fill="#B45309" font-size="16" font-weight="700">⏳</text>
      <text x="80" y="146" fill="#B45309" font-size="16" font-weight="700">⏳ Thịt bò phi lê (LOT-003) cận hạn FEFO Cấp 1 (Còn 2 ngày)</text>
      <text x="80" y="170" fill="#64748B" font-size="13">Vị trí: Tủ lạnh &gt; Ngăn mát • Hạn dùng: 17/11/2026 • Số lượng còn: 500 g</text>
      <rect x="960" y="138" width="140" height="34" rx="6" fill="#1E293B" />
      <text x="980" y="160" fill="#0F172A" font-size="13" font-weight="600">Gợi ý chế biến</text>

      <!-- 3. Tím than: Cạn kho (current_quantity <= min_threshold) -->
      <rect x="0" y="220" width="1130" height="90" rx="8" fill="#0F172A" stroke="#4338CA" stroke-width="1.5" />
      <circle cx="40" cy="265" r="18" fill="#312E81" />
      <text x="33" y="271" fill="#312E81" font-size="16" font-weight="700">◆</text>
      <text x="80" y="256" fill="#4338CA" font-size="16" font-weight="700">Gạo ST25 &amp; Trứng gà ta — Cạn kho (current_quantity ≤ min_threshold)</text>
      <text x="80" y="280" fill="#64748B" font-size="13">Tồn: 1 kg / Ngưỡng min: 2 kg • Cần mua thêm bổ sung vào Shopping List</text>
      <rect x="960" y="248" width="140" height="34" rx="6" fill="#312E81" stroke="#4338CA" />
      <text x="982" y="270" fill="#312E81" font-size="13" font-weight="600">Cần mua thêm</text>

      <!-- 4. Xanh lục: An toàn (> 3 ngày) -->
      <rect x="0" y="330" width="1130" height="90" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1" />
      <circle cx="40" cy="375" r="18" fill="#1E293B" />
      <text x="34" y="382" fill="#059669" font-size="16" font-weight="700">✓</text>
      <text x="80" y="366" fill="#059669" font-size="16" font-weight="700">Sữa chua Vinamilk (LOT-002) — An toàn (Còn 13 ngày)</text>
      <text x="80" y="390" fill="#64748B" font-size="13">Vị trí: Tủ lạnh &gt; Ngăn mát • Hạn dùng: 28/11/2026 • Số lượng còn: 4 hộp</text>
      <rect x="960" y="358" width="140" height="34" rx="6" fill="#1E293B" />
      <text x="1000" y="380" fill="#059669" font-size="13" font-weight="600">An toàn</text>

      <!-- Shopping List Preview: Gom 3 quầy (GET /api/shopping-list) -->
      <g transform="translate(0, 438)">
        <rect x="0" y="0" width="1130" height="115" rx="10" fill="#0F172A" stroke="#4338CA" stroke-width="1" />
        <text x="20" y="28" fill="#312E81" font-size="14" font-weight="700">Danh Sách Đi Chợ Gom 3 Quầy (GET /api/shopping-list — current_quantity ≤ min_threshold)</text>
        <rect x="20" y="44" width="345" height="56" rx="8" fill="#0F172A" stroke="#94A3B8" />
        <text x="34" y="66" fill="#0284C7" font-size="12" font-weight="700">1. Quầy Tươi sống</text>
        <text x="34" y="86" fill="#334155" font-size="12">Thịt bò (+500g), Trứng gà (+10 quả)</text>
        <rect x="392" y="44" width="345" height="56" rx="8" fill="#0F172A" stroke="#94A3B8" />
        <text x="406" y="66" fill="#1E293B" font-size="12" font-weight="700">2. Quầy Rau củ</text>
        <text x="406" y="86" fill="#334155" font-size="12">Rau cải thìa (+300g), Giá đỗ (+200g)</text>
        <rect x="764" y="44" width="345" height="56" rx="8" fill="#0F172A" stroke="#94A3B8" />
        <text x="778" y="66" fill="#4338CA" font-size="12" font-weight="700">3. Quầy Đồ khô / Gia vị</text>
        <text x="778" y="86" fill="#334155" font-size="12">Gạo ST25 (+2kg), Sữa tươi (+2 hộp)</text>
      </g>
    </g>
  </g>
