    <!-- Sidebar Bottom System Tray Status -->
    <g transform="translate(16, 790)">
      <rect x="0" y="0" width="228" height="80" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <circle cx="20" cy="24" r="6" fill="#1E293B" />
