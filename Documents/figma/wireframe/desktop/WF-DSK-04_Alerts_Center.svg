      <text x="14" y="22" fill="#64748B" font-size="12">Thời gian giả lập:</text>
      <text x="120" y="22" fill="#0284C7" font-size="13" font-weight="700">15/11/2026</text>
      <rect x="210" y="4" width="45" height="26" rx="4" fill="#334155" />
      <text x="222" y="21" fill="#0F172A" font-size="12">-1d</text>
      <rect x="262" y="4" width="45" height="26" rx="4" fill="#1E293B" />
