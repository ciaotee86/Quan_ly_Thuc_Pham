        <rect x="0" y="192" width="320" height="40" rx="6" fill="#0F172A" /><text x="14" y="217" fill="#FFF" font-size="13">5. Đồ khô &amp; Gia vị</text>
      </g>

      <!-- Card 2: Units -->
